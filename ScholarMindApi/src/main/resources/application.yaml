server:
  port: 8992

spring:
  application:
    name: scholar-mind-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${APP_DB_URL:jdbc:mysql://127.0.0.1:3306/scholar_mind?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${APP_DB_USERNAME:root}
    password: ${APP_DB_PASSWORD:1829002}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: ZH_CN
    enable-swagger-models: true
    enable-dynamic-parameter: false
    footer-custom-content: "<strong>Application Template API</strong>"
    enable-footer-custom: true
    enable-footer: true
    enable-document-manage: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  ai:
    ark:
      enabled: ${APP_AI_ENABLED:true}
      fail-fast: ${APP_AI_FAIL_FAST:false}
      base-url: ${APP_AI_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      api-key: ${APP_AI_API_KEY:90be7f6f-9930-449b-8577-edcaf91911a5}
      model-name: ${APP_AI_MODEL:doubao-seed-2-0-lite-260428}
      timeout-seconds: ${APP_AI_TIMEOUT_SECONDS:120}
      temperature: ${APP_AI_TEMPERATURE:0.7}
      pending-timeout-seconds: ${APP_AI_PENDING_TIMEOUT_SECONDS:300}
      max-prompt-chars: ${APP_AI_MAX_PROMPT_CHARS:12000}
      max-image-count: ${APP_AI_MAX_IMAGE_COUNT:3}
      max-image-size-bytes: ${APP_AI_MAX_IMAGE_SIZE_BYTES:5242880}
      max-image-total-bytes: ${APP_AI_MAX_IMAGE_TOTAL_BYTES:10485760}
      image-transfer-mode: ${APP_AI_IMAGE_TRANSFER_MODE:BASE64}
    retrieval:
      # 混合检索：BM25 稀疏召回 + Milvus 向量稠密召回，按 RRF 融合排序
      enabled: ${APP_RETRIEVAL_ENABLED:true}
      # RRF 融合常数 k：得分 = Σ 1/(k + rank)，业界常用 60
      rrf-k: ${APP_RETRIEVAL_RRF_K:60}
      # 两路召回的候选数量
      sparse-top-k: ${APP_RETRIEVAL_SPARSE_TOP_K:30}
      dense-top-k: ${APP_RETRIEVAL_DENSE_TOP_K:30}
      # BM25 参数：k1 控制词频饱和，b 控制文档长度归一化
      bm25-k1: ${APP_RETRIEVAL_BM25_K1:1.2}
      bm25-b: ${APP_RETRIEVAL_BM25_B:0.75}
      # 融合后是否再用外部重排模型做最终排序
      rerank-enabled: ${APP_RETRIEVAL_RERANK_ENABLED:true}
      # 单次检索的最小候选数
      candidate-floor: ${APP_RETRIEVAL_CANDIDATE_FLOOR:12}
  agent:
    bocha:
      web-search:
        enabled: ${APP_AGENT_WEB_SEARCH_ENABLED:false}
        base-url: ${APP_AGENT_WEB_SEARCH_BASE_URL:https://api.bocha.cn/v1/web-search}
        api-key: ${APP_AGENT_WEB_SEARCH_API_KEY:sk-7c2455144b084f81890d51c6620f7969}
        timeout-seconds: ${APP_AGENT_WEB_SEARCH_TIMEOUT_SECONDS:20}
        freshness: ${APP_AGENT_WEB_SEARCH_FRESHNESS:noLimit}
        summary: ${APP_AGENT_WEB_SEARCH_SUMMARY:true}
        count: ${APP_AGENT_WEB_SEARCH_COUNT:5}
        include: ${APP_AGENT_WEB_SEARCH_INCLUDE:}
        exclude: ${APP_AGENT_WEB_SEARCH_EXCLUDE:}
      rerank:
        enabled: ${APP_AGENT_RERANK_ENABLED:true}
        base-url: ${APP_AGENT_RERANK_BASE_URL:https://api.bocha.cn/v1/rerank}
        api-key: ${APP_AGENT_RERANK_API_KEY:sk-7c2455144b084f81890d51c6620f7969}
        timeout-seconds: ${APP_AGENT_RERANK_TIMEOUT_SECONDS:20}
        model: ${APP_AGENT_RERANK_MODEL:gte-rerank}
        top-n: ${APP_AGENT_RERANK_TOP_N:6}
        return-documents: ${APP_AGENT_RERANK_RETURN_DOCUMENTS:true}
    rag:
      milvus:
        enabled: ${APP_RAG_MILVUS_ENABLED:true}
        uri: ${APP_RAG_MILVUS_URI:http://127.0.0.1:19530}
        token: ${APP_RAG_MILVUS_TOKEN:}
        timeout-seconds: ${APP_RAG_MILVUS_TIMEOUT_SECONDS:20}
        collection-name: ${APP_RAG_MILVUS_COLLECTION:scholar_mind_knowledge}
        vector-field: ${APP_RAG_MILVUS_VECTOR_FIELD:vector}
        # 必须与 embedding 模型的实际输出维度一致：doubao-embedding-text-240715 实测为 2560
        # （此前误配为 1560，会导致 Milvus 报 "Incorrect dimension for field 'vector'"）
        dimension: ${APP_RAG_EMBEDDING_DIMENSION:2560}
        top-k: ${APP_RAG_MILVUS_TOP_K:5}
        chunk-size: ${APP_RAG_CHUNK_SIZE:800}
        chunk-overlap: ${APP_RAG_CHUNK_OVERLAP:120}
        max-chunks-per-document: ${APP_RAG_MAX_CHUNKS_PER_DOCUMENT:30}
      embedding:
        # Available values:
        #   ARK_OPENAI: Volcengine Ark OpenAI-compatible embeddings, recommended for real RAG.
        #   OPENAI_COMPATIBLE: Other OpenAI-compatible embedding providers.
        #   LOCAL_HASH: Local deterministic hash vectors for offline development only.
        provider: ${APP_RAG_EMBEDDING_PROVIDER:ARK_OPENAI}
        base-url: ${APP_RAG_EMBEDDING_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
        api-key: ${APP_RAG_EMBEDDING_API_KEY:90be7f6f-9930-449b-8577-edcaf91911a5}
        model: ${APP_RAG_EMBEDDING_MODEL:doubao-embedding-text-240715}
        timeout-seconds: ${APP_RAG_EMBEDDING_TIMEOUT_SECONDS:180}
  security:
    jwt:
      secret: ${APP_JWT_SECRET:change-this-template-secret-to-a-secure-value}
      issuer: ${APP_JWT_ISSUER:scholar-mind}
      expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:7200}
  storage:
    base-path: ${APP_STORAGE_BASE_PATH:scholar-mind}
    preview-expire-minutes: ${APP_STORAGE_PREVIEW_EXPIRE_MINUTES:30}
    rustfs:
      endpoint: ${APP_STORAGE_S3_ENDPOINT:http://127.0.0.1:9990}
      access-key: ${APP_STORAGE_S3_ACCESS_KEY:rustfsadmin}
      secret-key: ${APP_STORAGE_S3_SECRET_KEY:rustfsadmin}
      bucket: ${APP_STORAGE_S3_BUCKET:scholar-mind}
      region: ${APP_STORAGE_S3_REGION:us-east-1}
      force-path-style: ${APP_STORAGE_S3_FORCE_PATH_STYLE:true}
  file:
    max-size: ${APP_FILE_MAX_SIZE:52428800}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      - audio/mpeg
      - audio/wav
      - audio/mp4
      - audio/webm
      - audio/aac
      - audio/ogg
      - application/pdf
      - text/plain
    temp-expire-hours: ${APP_FILE_TEMP_EXPIRE_HOURS:24}
    cleanup-cron: ${APP_FILE_CLEANUP_CRON:0 0 * * * *}

